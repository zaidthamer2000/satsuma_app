name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install external programs (FFmpeg, Tesseract, Pandoc, LibreOffice)
        shell: powershell
        run: |
          choco install ffmpeg tesseract pandoc libreoffice-fresh -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Show detected components
        run: python -m satsuma doctor
      - name: Run all tests (includes the real Qt window, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr pandoc libreoffice-writer libreoffice-calc libegl1 libxkbcommon0 libdbus-1-3
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: pyinstaller packaging/satsuma.spec --noconfirm --clean
      - name: Smoke test the built program (converts a real file)
        shell: powershell
        run: |
          .\dist\Satsuma\satsuma-cli.exe doctor
          python -c "from PIL import Image; Image.new('RGB',(64,64),(200,80,20)).save('smoke.png')"
          .\dist\Satsuma\satsuma-cli.exe convert smoke.png --to webp
          if (-not (Test-Path smoke.webp)) { throw "built program failed to convert" }
          .\dist\Satsuma\satsuma-cli.exe compress smoke.png --size 2KB
      - name: Build installer
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Satsuma-windows
          path: |
            dist/Satsuma-Setup-*.exe
            dist/Satsuma/
