name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Extract Project Zip
      run: |
        Expand-Archive -Path Satsuma-source.zip -DestinationPath . -Force

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        $folder = Get-ChildItem -Directory | Where-Object { $_.Name -like "*satsuma*" } | Select-Object -First 1
        Set-Location $folder.FullName
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        if (Test-Path "requirements-dev.txt") { pip install -r requirements-dev.txt }
        pip install pyinstaller

    - name: Build with PyInstaller spec
      run: |
        $folder = Get-ChildItem -Directory | Where-Object { $_.Name -like "*satsuma*" } | Select-Object -First 1
        Set-Location $folder.FullName
        pyinstaller packaging/satsuma.spec --noconfirm --clean

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Satsuma-windows
        path: "**/dist/*"
